<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Feudalism map</title>
  <style>
    :root { --bg: #1e1f22; --panel: #2b2d31; --line: #3a3c42; --text: #f2f3f5; --muted: #b5bac1; --accent: #5865f2; --chip: #2f3136; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
                 font-family: Inter, system-ui, sans-serif; }
    button { font: inherit; color: inherit; cursor: pointer; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1em; }
    #app { display: none; height: 100%; flex-direction: column; }
    #top { height: 56px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--bg);
           border-bottom: 1px solid var(--line); }
    #who { display: flex; align-items: center; gap: 10px; flex: none; font-size: 16px; font-weight: 700; }
    .night { color: var(--muted); font-size: 12px; font-weight: 500; }
    #pills { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
    .pill { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 8px; padding: 7px 12px;
            white-space: nowrap; flex: none; }
    .pill i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .pill span { color: var(--muted); font-size: 13px; }
    .pill b { font-size: 14px; }
    #hold { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow-x: auto;
            border-bottom: 1px solid var(--line); box-sizing: border-box; }
    .hlabel { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; flex: none; }
    .hchip { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 8px; padding: 4px 10px;
             white-space: nowrap; flex: none; }
    .hchip span { color: var(--muted); font-size: 12px; }
    .hchip b { font-size: 13px; }
    .hchip.zero b { color: #8a8f98; }
    .hsep { width: 1px; height: 20px; background: var(--line); flex: none; margin: 0 4px; }
    #main { flex: 1; display: flex; min-height: 0; }
    #mapwrap { flex: 1; position: relative; min-width: 0; min-height: 0; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .overlay { position: absolute; display: flex; gap: 8px; }
    #chips { top: 12px; left: 12px; }
    .chip { display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; padding: 0 12px; height: 36px;
            font-size: 13px; font-weight: 500; background: #1e1f22cc; }
    .chip.on { background: var(--accent); }
    #zoom { right: 12px; bottom: 12px; flex-direction: column; gap: 6px; }
    #zoom button { width: 40px; height: 40px; border: 0; border-radius: 8px; background: #1e1f22e6; display: grid; place-items: center; font-size: 20px; }
    #legend { left: 12px; bottom: 12px; gap: 14px; background: #1e1f22e6; border-radius: 8px; padding: 8px 12px; font-size: 12px;
              flex-wrap: wrap; max-width: calc(100% - 90px); }
    #legend span { display: flex; align-items: center; gap: 6px; }
    .sw { width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box; border: 2px solid; display: block; flex: none; }
    #panel { width: 340px; flex: none; box-sizing: border-box; background: var(--panel); border-left: 1px solid var(--line);
             padding: 20px; overflow-y: auto; }
    #panel .grip { display: none; }
    .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    h2 { margin: 4px 0 0; font-size: 22px; font-weight: 700; }
    .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { display: flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
    .box { background: var(--bg); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .box h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .row span:first-child { color: var(--muted); }
    .row .short { color: #f0877a; }
    .note { font-size: 12px; color: var(--muted); }
    .btn { border: 0; border-radius: 8px; height: 44px; padding: 0 14px; font-size: 14px; font-weight: 600; text-align: left; }
    .btn.primary { background: var(--accent); color: #fff; text-align: center; }
    .btn.plain { background: #3a3c42; }
    .btn { transition: filter .12s, transform .06s; }
    .btn:not(.off):hover { filter: brightness(1.15); }
    .btn:not(.off):active { transform: scale(.97); }
    .btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .btn.off { background: var(--chip); color: #8a8f98; cursor: default; }
    .msg { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
    .msg.ok { background: #25412f; }
    .msg.bad { background: #4a2b2b; }
    .hint { color: var(--muted); font-size: 14px; line-height: 1.45; }
    #tabs { display: flex; gap: 4px; margin: -4px 0 14px; overflow-x: auto; }
    .tab { border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; background: transparent; color: var(--muted); flex: none; }
    .tab.on { background: var(--bg); color: var(--text); }
    .field { width: 100%; box-sizing: border-box; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
             color: var(--text); font: inherit; font-size: 14px; padding: 0 10px; }
    .pair { display: flex; gap: 8px; }
    .pair .btn { flex: 1; text-align: center; }
    .meter { display: flex; flex-direction: column; gap: 6px; }
    .track { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
    .track i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
    .track i.full { background: #e0b050; }
    .tab { position: relative; }
    .tab.alert { color: #ff8a8f; }
    .ctl { padding: 3px 4px; border-radius: 8px; }
    .ctl:hover { background: #ffffff0a; }
    .box + .box { margin-top: 12px; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .stepper .btn { height: 32px; width: 32px; padding: 0; text-align: center; }
    .stepper b { min-width: 14px; text-align: center; }
    .dim { opacity: .45; }
    .ctl { display: grid; grid-template-columns: minmax(64px, 1fr) 32px 40px 32px 78px 48px; gap: 6px; align-items: center; font-size: 14px; }
    .ctl > span:first-child { color: var(--muted); }
    .ctl b { text-align: center; font-variant-numeric: tabular-nums; }
    .ctl .btn { height: 32px; width: 32px; padding: 0; text-align: center; }
    .ctl .btn.auto { width: 48px; font-size: 12px; }
    .ctl .est { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .contest { display: grid; gap: 6px; padding-bottom: 8px; }
    .text { white-space: pre-wrap; font-size: 13px; line-height: 1.45; }
    @media (max-width: 700px) {
      #top { height: 52px; gap: 12px; }
      #main { flex-direction: column; }
      #legend { display: none; }
      #zoom button { width: 44px; height: 44px; }
      #panel { width: auto; flex: 0 0 38%; border-left: 0; border-radius: 16px 16px 0 0; margin-top: -12px; position: relative;
               padding: 10px 16px 16px; }
      #panel .grip { display: block; width: 40px; height: 4px; border-radius: 2px; background: #5a5d66; margin: 0 auto 12px; }
      h2 { font-size: 20px; }
    }
    #intro { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; box-sizing: border-box; }
    #intro .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; max-width: 440px; max-height: 90%; overflow-y: auto; font-size: 14px; line-height: 1.45; }
    #intro .art { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
    #intro .art img { height: 34px; width: auto; }
    #intro h2 { margin: 0 0 8px; font-size: 20px; }
    #intro h3 { margin: 12px 0 4px; font-size: 14px; }
    #intro p { margin: 6px 0; }
    #intro button { margin-top: 12px; width: 100%; padding: 10px; font-size: 15px; cursor: pointer; }
    #over { display: none; position: absolute; inset: 0; overflow-y: auto; padding: 32px 16px; box-sizing: border-box; text-align: center; }
    #over img { height: 200px; max-width: 80%; object-fit: contain; }
    #over h1 { margin: 12px 0 4px; font-size: 32px; font-weight: 700; }
    #over .sub { color: var(--muted); font-size: 15px; margin: 0 auto 20px; max-width: 520px; }
    #over table { margin: 0 auto; border-collapse: collapse; min-width: 320px; max-width: 520px; width: 100%; font-size: 14px; text-align: left; }
    #over th { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
    #over th, #over td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
    #over td:nth-child(n+3), #over th:nth-child(n+3) { text-align: right; }
    #over tr.me td { background: var(--panel); font-weight: 700; }
    #over tr.out td { color: var(--muted); }
    .row .x { border: 0; background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 12px; flex: none; }
    .row .x:hover { filter: brightness(1.2); }
    /* the optional paper theme: an old parchment map */
    body.paper { --bg: #efe3c4; --panel: #f6ecd2; --line: #cdb98b; --text: #3b2f1e; --muted: #7a6a4c; --accent: #8b5a2b; --chip: #eadcb6;
                 font-family: Georgia, "Iowan Old Style", serif; }
    /* the industrial theme (Industrialism games): soot, steel and rust */
    body.industrial { --bg: #17191b; --panel: #232629; --line: #3a3f44; --text: #e6e2d8; --muted: #a29e93; --accent: #d9822b; --chip: #2a2e32;
                      font-family: "Barlow Semi Condensed", "Arial Narrow", Inter, system-ui, sans-serif; }
    body.industrial .chip.on { background: var(--accent); color: #1a1a1a; }
    body.paper .chip { background: #f6ecd2e6; }
    body.paper .chip.on { background: var(--accent); color: #fff; }
    body.paper #zoom button, body.paper #legend { background: #f6ecd2f0; }
    body.paper .btn.plain { background: #e2d2a6; }
    body.paper .btn.off { color: #a8987a; }
    body.paper .msg.ok { background: #d7e3bd; }
    body.paper .msg.bad { background: #ecc9bd; }
    body.paper .row .short { color: #a63d2f; }
    body.paper .hchip.zero b { color: #a8987a; }
    body.paper .btn:focus-visible, body.paper .tab:focus-visible, body.paper .chip:focus-visible { outline-color: var(--accent); }
  </style>
</head>
<body>
  <p id="status">Connecting to Discord...</p>
  <div id="over"></div>
  <div id="intro"></div>
  <div id="app">
    <div id="top"><div id="who"></div><div id="pills"></div></div>
    <div id="hold"></div>
    <div id="main">
      <div id="mapwrap">
        <canvas id="map"></canvas>
        <div id="chips" class="overlay">
          <button class="chip on" id="terrain">Terrain</button>
          <button class="chip" id="coords">Coordinates</button>
          <button class="chip" id="paper">Paper</button>
          <button class="chip" id="industrial" style="display:none">Industrial</button>
        </div>
        <div id="zoom" class="overlay">
          <button id="zin" aria-label="Zoom in">+</button>
          <button id="zout" aria-label="Zoom out">&minus;</button>
          <button id="home" aria-label="Back to my capital">&#9678;</button>
        </div>
        <div id="legend" class="overlay"></div>
      </div>
      <aside id="panel"><div class="grip"></div><div id="tabs"></div><div id="npanel" style="display:none"></div><div id="card"><p class="hint">Click a tile to see what is there.</p></div></aside>
    </div>
  </div>
  <script src="/static/app.js?v=26"></script>
</body>
</html>
