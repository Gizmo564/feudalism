<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Feudalism map</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2d31; color: #f2f3f5;
                 font-family: system-ui, sans-serif; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 1em; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: none; }
    #bar { position: absolute; top: 8px; left: 8px; display: none; gap: 6px; align-items: center; }
    #bar span, #bar button { background: #1e1f22; color: #f2f3f5; border: 0; border-radius: 6px; padding: 6px 10px;
                             font: inherit; }
    #bar button { cursor: pointer; }
    #bar button.on { background: #5865f2; }
    #card { position: absolute; left: 8px; bottom: 8px; max-width: 320px; display: none; background: #1e1f22;
            border-radius: 8px; padding: 10px 12px; line-height: 1.4; white-space: pre-line; }
  </style>
</head>
<body>
  <p id="status">Connecting to Discord...</p>
  <canvas id="map"></canvas>
  <div id="bar">
    <span id="who"></span>
    <button id="zin">+</button><button id="zout">&minus;</button>
    <button id="coords">Coords</button><button id="home">Capital</button>
  </div>
  <div id="card"></div>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
